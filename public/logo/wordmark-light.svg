    <!-- Left Facet -->
    <path d="M22 0L4 36H16L22 22L28 36H40L22 0Z" fill="url(#paint0_linear_light)"/>
    <!-- Top Apex Highlight -->
    <path d="M22 0L14 16H30L22 0Z" fill="#FF383C"/>
