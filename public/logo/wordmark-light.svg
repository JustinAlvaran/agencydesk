  <!-- Subtle Tagline -->
  <text x="57" y="47" font-family="var(--font-lato), sans-serif" font-size="9.5" font-weight="600" fill="#4B5563" letter-spacing="1.5px">CRM &amp; CLIENT WORKSPACE</text>

  <defs>
