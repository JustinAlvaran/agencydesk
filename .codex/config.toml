# AgencyDesk-only GetLayers connection requested by the owner.
# Sign-in and the owner's existing GetLayers entitlement are separate steps.
[mcp_servers.getlayers]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.getlayers.ai/mcp"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 120

[mcp_servers.getlayers.env]
MCP_REMOTE_CONFIG_DIR = "C:/Users/paule/OneDrive/Documents/ChatGPT/agencydesk/.local/getlayers-auth"
npm_config_cache = "C:/Users/paule/OneDrive/Documents/ChatGPT/agencydesk/.local/getlayers-npm-cache"
